<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coding Clubhouse</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    body {
      font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
  </style>

  </head>

  <body class="bg-white">
    <!-- Section 1: Header -->
    <header class="bg-[#6D3FF2] text-white">
      <div class="max-w-6xl mx-auto px-4">
        <!-- Mobile: column, center; Desktop: row, space-between -->
        <div class="flex flex-col items-center gap-3 py-4 sm:py-6 md:flex-row md:justify-between md:gap-0">
          
          <!-- Brand -->
          <div class="flex flex-col leading-none items-center md:items-start">
            <img
              src="assets/img/TheCoding.png"
              alt="TheCoding"
              class="mb-1 h-5 sm:h-6 md:h-7 object-contain drop-shadow"
            />
            <img
              src="assets/img/ClubHouse.png"
              alt="ClubHouse"
              class="h-2 sm:h-3 md:h-4 -mt-1 object-contain"
            />
          </div>

          <!-- Nav: always visible, centered on mobile -->
          <nav class="flex flex-wrap justify-center items-center gap-4 text-sm font-medium text-white/90 md:gap-8">
            <a href="#" class="hover:text-white">About Us</a>
            <a href="#" class="hover:text-white">Programs</a>
            <a href="#" class="hover:text-white">Resources</a>
            <a href="#" class="hover:text-white">Get Involved</a>

            <a
              href="#"
              class="inline-flex items-center rounded-lg bg-white px-4 py-2 text-black hover:bg-white/20 transition"
            >
             <img src="assets/img/Heart.jpg" class="h-4 w-4 mr-2 ">Donate
            </a>
          </nav>

        </div>
      </div>
    </header>
    <!-- HERO SECTION -->
<section class="bg-[#6D3FF2] text-white">
  <div class="max-w-6xl mx-auto px-4">
    <!-- 2-column layout on large screens, stacked on mobile -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 items-start pt-16 pb-24">
      
      <!-- LEFT: text block -->
      <div class="text-left lg:text-left">
        <!-- print line -->
        <p class="text-sm font-semibold tracking-[0.12em] text-[#04FFDD]">
          print ("Hello world!")
        </p>

        <!-- main heading -->
        <h1
          class="mt-6 text-[32px] sm:text-[40px] lg:text-[56px] font-semibold leading-[1.2] text-[#F6EBF9]"
        >
          Foundations First.<br />

          <span class="inline-flex items-center gap-3 mt-2">
            <!-- Futures pill -->
            <span
              class="inline-block rounded-[18px] bg-[#FF7A59] px-10 py-3 -rotate-2 shadow-xl"
            >
              Futures
            </span>

            <span>Forever.</span>
          </span>
        </h1>

        <!-- subtitle -->
        <p
          class="mt-6 max-w-xl mx-auto text-sm sm:text-base text-[#F6EBF9]/80"
        >
          We equip underrepresented children with coding skills and digital
          confidence — empowering them to imagine, create, and lead.
        </p>

        <!-- buttons -->
        <div class="mt-8 flex flex-wrap justify-center gap-4">
          <!-- yellow button (use your rocket.svg here) -->
          <a
            href="#"
            class="inline-flex items-center gap-2 rounded-[14px] bg-[#F7C948] px-6 py-3 text-sm font-semibold text-slate-900 shadow-sm hover:brightness-95 transition"
          >
            <img
              src="assets/img/RocketLaunch.svg"
              alt=""
              class="h-4 w-4"
            />
            Explore Our Programs
          </a>

          <!-- white button with heart -->
          <a
            href="#"
            class="inline-flex items-center gap-2 rounded-[14px] bg-white px-6 py-3 text-sm font-semibold text-slate-900 shadow-sm hover:bg-white/90 transition"
          >
            <svg
              class="h-4 w-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M20.8 4.6c-1.7-1.7-4.5-1.7-6.2 0L12 7.2 9.4 4.6c-1.7-1.7-4.5-1.7-6.2 0s-1.7 4.5 0 6.2L12 19.6l8.8-8.8c1.7-1.7 1.7-4.5 0-6.2z"
              />
            </svg>
            Support the Movement
          </a>
        </div>
      </div>

      <!-- RIGHT: hero image with ring (your PNG) -->
      <div class="flex justify-center lg:justify-end mt-10 lg:mt-0">
        <div
          class="h-64 w-64 sm:h-80 sm:w-80 bg-center bg-contain bg-no-repeat"
          style="background-image: url('assets/Hero image image.png');"
        ></div>
      </div>

    </div>
  </div>
</section>


  </body>
</html>
